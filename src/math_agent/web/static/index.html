<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>数学教学工作台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">∑</span><div><strong>数学教学工作台</strong><span>本地讲义与课件 · 可恢复的教学工作流</span></div></div>
    <div id="connection" class="status-pill" role="status">正在连接本地服务</div>
  </header>
  <div class="shell">
    <aside aria-label="任务导航">
      <button id="new-run" class="primary full">＋ 新建任务</button>
      <a class="artifact-link" href="/visualizations">数学概念 → 视频与交互页面</a>
      <h2 class="aside-title">最近任务</h2>
      <nav id="run-list" aria-label="已保存任务"></nav>
      <details class="environment"><summary>本机能力与模板</summary><div id="capabilities">正在读取</div></details>
      <p class="aside-note">关闭页面不会取消运行。任务、计划与检查记录保存在本机。</p>
    </aside>
    <main id="main" tabindex="-1"><p class="empty">正在读取工作台…</p></main>
  </div>
  <div id="notice" role="alert" aria-live="assertive" hidden></div>
  <footer>本机运行 · 模型请求由后端发送 · 数学与视觉审核分别记录</footer>
</body>
</html>
