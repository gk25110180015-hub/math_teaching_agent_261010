[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "math-teaching-agent"
version = "0.1.0"
description = "Independent local mathematics teaching workflows for Windows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1", "pylatexenc==2.10", "sympy>=1.13,<2",
  "pypdfium2>=4.30,<6", "pdfplumber>=0.11,<1", "PyYAML>=6,<7", "Pillow>=10,<13",
  "playwright>=1.48,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.48,<2"]
[project.scripts]
math-agent = "math_agent.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/math_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: offline logic", "integration: local integration", "e2e: real browser", "real_api: opted-in live provider", "reference: original chapter inputs", "security: adversarial inputs", "windows_compile: actual XeLaTeX on Windows"]
